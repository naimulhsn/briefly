# Twice-daily briefing at 6:00 and 18:00 Asia/Dhaka (00:00 and 12:00 UTC).
# Render's free web service sleeps after 15 idle minutes, so this job
# first wakes the app, then starts ingest (202) and polls until it finishes.
name: Twice-daily briefing
on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the service and run ingest
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${INGEST_SECRET:-}" ]; then
            echo "APP_URL or INGEST_SECRET is not set"
            exit 1
          fi
          base="${APP_URL%/}"
          python3 -c 'import os,urllib.parse; print("Target host:", urllib.parse.urlparse(os.environ["APP_URL"]).netloc)'

          wake() {
            curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$base/api/health" || true
          }
          start_ingest() {
            curl -sS -o /tmp/ingest.json -w "%{http_code}" \
              -X POST "$base/api/ingest/run" \
              -H "X-Ingest-Secret: $INGEST_SECRET" \
              -H "Content-Type: application/json" \
              --max-time 90 || true
          }
          status() {
            curl -sS -o /tmp/status.json -w "%{http_code}" --max-time 60 "$base/api/ingest/status" || true
          }

          up=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "Wake attempt $i…"
            code=$(wake)
            echo "  health HTTP $code"
            if [ "$code" = "200" ]; then
              up=1
              break
            fi
            sleep $((10 * i))
          done
          if [ "$up" != "1" ]; then
            echo "Service did not become healthy"
            exit 1
          fi

          started=0
          for i in 1 2 3 4 5; do
            echo "Start ingest attempt $i…"
            icode=$(start_ingest)
            echo "  ingest HTTP $icode"
            if [ "$icode" = "202" ] || [ "$icode" = "200" ] || [ "$icode" = "409" ]; then
              started=1
              break
            fi
            sleep $((10 * i))
          done
          if [ "$started" != "1" ]; then
            echo "Could not start ingest"
            exit 1
          fi

          echo "Polling ingest status…"
          for i in $(seq 1 24); do
            scode=$(status)
            if [ "$scode" != "200" ]; then
              echo "  poll $i: status HTTP $scode"
              sleep 10
              continue
            fi
            python3 - << 'PY'
          import json, sys
          d = json.load(open("/tmp/status.json"))
          running = d.get("running")
          lat = d.get("latest") or {}
          print("  poll: running=", running, "latest.status=", lat.get("status"), "stories=", lat.get("clusters_created"), "feeds=", lat.get("feeds_ok"))
          if running:
              sys.exit(2)
          if lat.get("status") == "ok":
              sys.exit(0)
          if lat.get("status") == "error":
              sys.exit(3)
          # No run recorded yet
          sys.exit(2)
          PY
            st=$?
            if [ "$st" = "0" ]; then
              echo "Ingest finished successfully"
              exit 0
            fi
            if [ "$st" = "3" ]; then
              echo "Ingest recorded an error"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for ingest to finish"
          exit 1
